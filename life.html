<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活 · 二宝的小站</title>
  <meta name="description" content="随笔、摄影与生活记录。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>

  <main id="main-content" class="theme-coral">
    <section class="section container">
      <h1 class="page-title">生活</h1>
      <p class="page-subtitle">不搞科研，我们可以一起。</p>

      <section class="life-album" aria-labelledby="music-title">
        <h2 id="music-title">音乐 · 换个频道</h2>
        <p class="album-note">实验讲究重复，练琴也是。偶尔换一种声音，继续保持好奇。</p>
        <h3 class="album-heading">架子鼓</h3>
        <div class="album-grid album-grid-two">
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-drums-1.jpg" width="1924" height="1280" alt="坐在架子鼓后，手持鼓棒练习" loading="lazy" decoding="async">
            <figcaption>敲一敲，换换脑回路。</figcaption>
          </figure>
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-drums-2.jpg" width="2466" height="1279" alt="戴着红帽子和白色耳机练习架子鼓" loading="lazy" decoding="async">
            <figcaption>跟着节拍走，暂时不赶进度。</figcaption>
          </figure>
        </div>
        <h3 class="album-heading">吉他</h3>
        <p class="album-note">滤镜负责可爱，手指负责和弦。</p>
        <div class="album-grid album-grid-three">
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-guitar-1.jpg" width="1024" height="2132" alt="使用小狗头像滤镜，穿绿色外衫抱着吉他" loading="lazy" decoding="async">
            <figcaption>今天的主唱有点特别。</figcaption>
          </figure>
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-guitar-2.jpg" width="1280" height="2652" alt="使用小狗头像滤镜，坐着练习吉他和弦" loading="lazy" decoding="async">
            <figcaption>和弦慢慢来。</figcaption>
          </figure>
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-guitar-3.jpg" width="1024" height="2138" alt="使用小狗头像滤镜，穿黑色上衣弹吉他" loading="lazy" decoding="async">
            <figcaption>保持练习，也保持好心情。</figcaption>
          </figure>
        </div>
      </section>

      <section class="life-album" aria-labelledby="running-title">
        <h2 id="running-title">跑步 · 出去转转</h2>
        <p class="album-note">有些思路，坐着想不通，就出去跑一跑。</p>
        <div class="album-grid album-grid-two">
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-running-1.jpg" width="1344" height="2912" alt="跑步数据、运动手表和夜跑自拍的拼图" loading="lazy" decoding="async">
            <figcaption>把思路跑顺。</figcaption>
          </figure>
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-running-2.jpg" width="1280" height="1837" alt="跑步记录、运动手表和操场自拍的拼图" loading="lazy" decoding="async">
            <figcaption>再往前一点。</figcaption>
          </figure>
        </div>
      </section>

      <section class="life-album" aria-labelledby="hiking-title">
        <h2 id="hiking-title">户外 · 去山里</h2>
        <p class="album-note">田野调查做久了，山也想自己爬一爬。</p>
        <div class="album-grid album-grid-three">
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-hiking-1.jpg" width="1706" height="1279" alt="背着蓝色背包、手持登山杖在山间自拍" loading="lazy" decoding="async">
            <figcaption>登山杖也算一种实验器材。</figcaption>
          </figure>
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-hiking-2.jpg" width="1280" height="1700" alt="坐在山顶巨石上远眺群山，比耶合影" loading="lazy" decoding="async">
            <figcaption>爬到山顶，视野和思路一起打开。</figcaption>
          </figure>
          <figure class="photo-slot photo-full album-photo">
            <img src="assets/img/life-rappel-1.jpg" width="1024" height="1776" alt="戴白色头盔在峡谷间绳降" loading="lazy" decoding="async">
            <figcaption>换个角度下山。</figcaption>
          </figure>
        </div>
      </section>

      <h2>科研之余，我们可以</h2>
      <div class="photo-grid">
        <div class="photo-slot photo-full"><img src="assets/img/life-3.jpg" alt="和朋友在长城上合影" loading="lazy"></div>
        <div class="photo-slot photo-full"><img src="assets/img/life-1.jpg" alt="和朋友聚餐时的自拍" loading="lazy"></div>
        <div class="photo-slot photo-full"><img src="assets/img/life-2.jpg" alt="卡通形象的合影" loading="lazy"></div>
        <div class="photo-slot photo-full"><img src="assets/img/life-4.jpg" width="1279" height="1572" alt="和朋友聚餐举着奶茶碰杯，朋友用柴犬贴纸遮脸" loading="lazy"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 二宝 · 用好奇心维护的小站 · <a href="https://github.com/erbaoyihao/erbaoyihao.github.io">本站源码</a></p>
      <p class="footer-note">认真生活，允许跑题。</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
