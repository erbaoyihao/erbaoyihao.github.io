<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面走丢了</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lost-page { text-align: center; padding: 96px 0 64px; }
    .lost-code {
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 900;
      margin: 0;
      letter-spacing: .05em;
    }
    .lost-code span { display: inline-block; }
    .lost-code .c1 { color: var(--yellow); transform: rotate(-6deg); text-shadow: 4px 4px 0 var(--ink); }
    .lost-code .c2 { color: var(--coral);  transform: rotate(3deg) translateY(-8px); text-shadow: 4px 4px 0 var(--ink); }
    .lost-code .c3 { color: var(--blue);   transform: rotate(7deg); text-shadow: 4px 4px 0 var(--ink); }
    .lost-pixel {
      font-size: 2rem;
      margin: 24px 0 8px;
      animation: hop 1.2s ease-in-out infinite;
    }
    @keyframes hop { 50% { transform: translateY(-12px); } }
  </style>
</head>
<body>
  <main class="container lost-page">
    <p class="lost-pixel" aria-hidden="true">🏃💨</p>
    <h1 class="lost-code"><span class="c1">4</span><span class="c2">0</span><span class="c3">4</span></h1>
    <p>哎呀，这个页面跑丢了……<br>可能是被我拖进回收站吃掉了。</p>
    <p><a class="btn" href="index.html">带我回首页</a></p>
  </main>
</body>
</html>
